<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#000">
  <title>agent-harness architecture</title>
  <desc>Three properties of agent-harness. One neutral command rule becomes Claude Code, Codex, and Devin permission syntax. One protected-path inventory feeds four enforcement layers. Rendered files are replaced on install, while configs that agents also write are merged by managed key only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#fff"/>

  <!-- 1. One rule, every agent's syntax -->
  <text x="20" y="32" font-size="15" font-weight="600">1. One neutral rule becomes each agent's permission syntax</text>
  <rect x="20" y="48" width="300" height="118" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="36" y="72" font-weight="600">command_permissions.json</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="36" y="100">{ "decision": "ask",</text>
    <text x="36" y="120">  "prefix": ["git", "push"],</text>
    <text x="36" y="140">  "justification": "..." }</text>
  </g>

  <line x1="320" y1="107" x2="370" y2="107" stroke="#000" stroke-width="1.5"/>
  <line x1="370" y1="64" x2="370" y2="150" stroke="#000" stroke-width="1.5"/>
  <line x1="370" y1="64" x2="416" y2="64" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="107" x2="416" y2="107" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="150" x2="416" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="46" width="520" height="36" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="420" y="89" width="520" height="36" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="420" y="132" width="520" height="36" fill="none" stroke="#000" stroke-width="1.2"/>
  <g font-weight="600">
    <text x="434" y="68">Claude Code</text>
    <text x="434" y="111">Codex</text>
    <text x="434" y="154">Devin</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <text x="548" y="68">permissions.ask: Bash(git push:*)</text>
    <text x="548" y="111">prefix_rule(pattern=["git","push"], decision="prompt")</text>
    <text x="548" y="154">permissions.ask: Exec(git push)</text>
  </g>

  <!-- 2. One inventory, four enforcement layers -->
  <text x="20" y="214" font-size="15" font-weight="600">2. One protected-path inventory feeds every enforcement layer</text>
  <rect x="20" y="230" width="300" height="160" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="36" y="254" font-weight="600">Protected-path inventory</text>
  <text x="36" y="274" fill="#555">computed once by generation/protection</text>
  <text x="36" y="302">Every rendered hook, rule, and</text>
  <text x="36" y="320">instruction file, plus the configs</text>
  <text x="36" y="338">the harness syncs.</text>
  <text x="36" y="366" fill="#555">Example:</text>
  <text x="96" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">~/.claude/settings.json</text>

  <line x1="320" y1="310" x2="370" y2="310" stroke="#000" stroke-width="1.5"/>
  <line x1="370" y1="246" x2="370" y2="375" stroke="#000" stroke-width="1.5"/>
  <line x1="370" y1="246" x2="416" y2="246" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="289" x2="416" y2="289" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="332" x2="416" y2="332" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="375" x2="416" y2="375" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="228" width="520" height="36" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="420" y="271" width="520" height="36" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="420" y="314" width="520" height="36" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="420" y="357" width="520" height="36" fill="none" stroke="#000" stroke-width="1.2"/>
  <g font-weight="600">
    <text x="434" y="250">Claude rules</text>
    <text x="434" y="293">Claude sandbox</text>
    <text x="434" y="336">Codex</text>
    <text x="434" y="379">Runtime hook</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <text x="548" y="250">permissions.deny: Edit(~/.claude/settings.json)</text>
    <text x="548" y="293">filesystem.denyWrite: ~/.claude/settings.json</text>
    <text x="548" y="336">guarded.filesystem: "~/.claude/settings.json"="read"</text>
    <text x="548" y="379">protected_paths.json</text>
  </g>
  <text x="710" y="379" fill="#555">blocks writes; fails closed</text>

  <!-- 3. Two write modes -->
  <text x="20" y="438" font-size="15" font-weight="600">3. Rendered files are replaced; files agents also write are merged</text>

  <rect x="20" y="454" width="450" height="176" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="36" y="478" font-weight="600">Replaced by install</text>
  <text x="36" y="498" fill="#555">rendered into staging, then swapped in</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="36" y="526">AGENTS.md, CLAUDE.md</text>
    <text x="36" y="548">hooks/, hooks.json, hook manifests</text>
    <text x="36" y="570">skills/</text>
    <text x="36" y="592">rules/default.rules</text>
    <text x="36" y="614">Hermes plugin, pi bridge</text>
  </g>

  <rect x="490" y="454" width="450" height="176" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="506" y="478" font-weight="600">Merged by sync-*: managed keys only</text>
  <text x="506" y="498" fill="#555">agent-owned state such as trust and approvals stays</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="506" y="526">~/.claude/settings.json</text>
    <text x="506" y="548">~/.codex/config.toml</text>
    <text x="506" y="570">~/.config/devin/config.json</text>
    <text x="506" y="592">~/.hermes/config.yaml</text>
  </g>
  <g fill="#555" font-size="12">
    <text x="726" y="526">generated top-level keys</text>
    <text x="726" y="548">managed top-level keys</text>
    <text x="726" y="570">managed keys, Exec(...) rules</text>
    <text x="726" y="592">plugins.enabled</text>
  </g>

  <text x="20" y="662" font-size="12">Users edit only the neutral source tree. Every agent file shown here is generated from it.</text>
</svg>
