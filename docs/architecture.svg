<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#000">
  <title>agent-harness architecture</title>
  <desc>A neutral source tree and optional external skills and hook bundles flow into the agent-harness renderer, which writes provider-native files for Claude Code, Codex, Devin, Hermes Agent, and pi, plus a generated protection policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#fff"/>

  <!-- Inputs -->
  <text x="20" y="34" font-size="15" font-weight="600">Source tree (one neutral source)</text>
  <rect x="20" y="46" width="250" height="250" fill="none" stroke="#000" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
    <text x="36" y="74">manifest.json</text>
    <text x="36" y="98">AGENTS.md</text>
    <text x="36" y="122">command_permissions.json</text>
    <text x="36" y="146">hooks.json</text>
    <text x="36" y="170">hooks/rules/*.json</text>
    <text x="36" y="194">skills/</text>
    <text x="36" y="218">skill_rendering.json</text>
    <text x="36" y="242">claude/settings.json</text>
    <text x="36" y="266">codex/config.toml</text>
  </g>

  <text x="20" y="334" font-size="15" font-weight="600">Optional composition inputs</text>
  <rect x="20" y="346" width="250" height="76" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="374">External skill directories</text>
  <text x="36" y="400">Versioned hook bundles</text>

  <!-- Renderer -->
  <text x="330" y="34" font-size="15" font-weight="600">agent-harness (Rust CLI)</text>
  <rect x="330" y="46" width="260" height="376" fill="none" stroke="#000" stroke-width="2.5"/>
  <text x="346" y="74" font-weight="600">source / layout / manifest</text>
  <text x="346" y="92">resolve and validate the tree</text>
  <line x1="346" y1="108" x2="574" y2="108" stroke="#000" stroke-width="0.75"/>
  <text x="346" y="132" font-weight="600">generation/*</text>
  <text x="346" y="150">hooks, skills, command permissions,</text>
  <text x="346" y="168">provider configs, bridges</text>
  <line x1="346" y1="184" x2="574" y2="184" stroke="#000" stroke-width="0.75"/>
  <text x="346" y="208" font-weight="600">generation/protection</text>
  <text x="346" y="226">one inventory of protected paths</text>
  <line x1="346" y1="242" x2="574" y2="242" stroke="#000" stroke-width="0.75"/>
  <text x="346" y="266" font-weight="600">render (install)</text>
  <text x="346" y="284">stage, then replace managed files</text>
  <line x1="346" y1="300" x2="574" y2="300" stroke="#000" stroke-width="0.75"/>
  <text x="346" y="324" font-weight="600">sync-* commands</text>
  <text x="346" y="342">merge managed keys into mutable</text>
  <text x="346" y="360">provider configs</text>
  <line x1="346" y1="376" x2="574" y2="376" stroke="#000" stroke-width="0.75"/>
  <text x="346" y="400" font-weight="600">runtime_root</text>
  <text x="456" y="400">relocate hook paths</text>

  <!-- Arrows into renderer -->
  <line x1="270" y1="171" x2="326" y2="171" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="384" x2="326" y2="384" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <text x="650" y="34" font-size="15" font-weight="600">Provider-native output</text>
  <g>
    <rect x="650" y="46" width="250" height="56" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="664" y="68" font-weight="600">Claude Code</text>
    <text x="664" y="88">settings, hooks, skills, statusline</text>

    <rect x="650" y="112" width="250" height="56" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="664" y="134" font-weight="600">Codex</text>
    <text x="664" y="154">config, hooks, execpolicy rules, skills</text>

    <rect x="650" y="178" width="250" height="56" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="664" y="200" font-weight="600">Devin</text>
    <text x="664" y="220">hook adapters, hooks and permissions</text>

    <rect x="650" y="244" width="250" height="56" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="664" y="266" font-weight="600">Hermes Agent / pi</text>
    <text x="664" y="286">hook manifests, plugin and bridge</text>

    <rect x="650" y="346" width="250" height="76" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="664" y="368" font-weight="600">Protection policy</text>
    <text x="664" y="388">protected_paths.json, Claude deny,</text>
    <text x="664" y="406">sandbox denyWrite, Codex guards</text>
  </g>

  <!-- Arrows out of renderer -->
  <line x1="590" y1="74" x2="646" y2="74" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="140" x2="646" y2="140" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="206" x2="646" y2="206" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="272" x2="646" y2="272" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="384" x2="646" y2="384" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="20" y="456" font-size="12">Generated files are never edited by hand. Change the source tree and render again.</text>
</svg>
