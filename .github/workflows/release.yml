name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # recovery of a stuck draft, run on the tag itself
    inputs:
      tag_name:
        description: Draft release tag to build and publish; run this workflow on the same tag
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.event_name == 'push'
    uses: furedea/reusable-workflows/.github/workflows/release-pr.yml@1a18c887067769099a2ded00f0fe398c7bd371bc # v1.2.0
    permissions: {}
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  build:
    needs: release-pr
    if: ${{ !cancelled() && (needs.release-pr.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_DIST_VERSION: 0.30.2
      TARGET: x86_64-unknown-linux-musl
      TAG_NAME: ${{ needs.release-pr.outputs.tag_name || inputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.99.1
          rustflags: ""

      - name: Install Rust release target
        run: rustup target add "$TARGET"

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" \
            | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: cargo test --locked

      - name: Build release artifacts
        run: |
          set -euo pipefail

          dist build \
            --tag "$TAG_NAME" \
            --target "$TARGET" \
            --artifacts=all \
            --output-format=json \
            > dist-manifest.json
          dist print-upload-files-from-manifest \
            --manifest dist-manifest.json \
            > dist-upload-files.txt

      - name: Smoke test packaged archive
        run: |
          set -euo pipefail

          archive_path="$(
            find target/distrib -maxdepth 1 -type f \
              \( -name "agent-harness-${TARGET}.tar.xz" -o -name "agent-harness-${TARGET}.tar.gz" \) \
              | head -n 1
          )"

          if [[ -z "$archive_path" ]]; then
            echo "agent-harness archive for ${TARGET} was not produced."
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/install" "$tmpdir/home"

          case "$archive_path" in
            *.tar.xz)
              tar -xJf "$archive_path" -C "$tmpdir/install" --strip-components=1
              ;;
            *.tar.gz)
              tar -xzf "$archive_path" -C "$tmpdir/install" --strip-components=1
              ;;
            *)
              echo "unsupported archive format: $archive_path"
              exit 1
              ;;
          esac

          "$tmpdir/install/agent-harness" --version
          "$tmpdir/install/agent-harness" install --prefix "$tmpdir/home"
          "$tmpdir/install/agent-harness" verify --prefix "$tmpdir/home"

      - name: Collect release assets
        run: |
          set -euo pipefail

          mapfile -t artifact_paths < dist-upload-files.txt
          if ((${#artifact_paths[@]} == 0)); then
            echo "cargo-dist did not report uploadable files."
            exit 1
          fi

          mkdir release-assets
          cp -- "${artifact_paths[@]}" release-assets/

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release-assets/*
          if-no-files-found: error

  release-publish:
    needs: [release-pr, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: furedea/reusable-workflows/.github/workflows/release-publish.yml@1a18c887067769099a2ded00f0fe398c7bd371bc # v1.2.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag-name: ${{ needs.release-pr.outputs.tag_name || inputs.tag_name }}
