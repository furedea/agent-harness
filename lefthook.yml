commit-msg:
  commands:
    commitlint:
      run: commitlint --edit {1}

# pre-commit owns whole-project format and lint checks. Tests run in CI.
pre-commit:
  parallel: true
  commands:
    nixfmt:
      glob: "*.nix"
      run: bash -c 'mapfile -t files < <(git ls-files "*.nix"); ((${#files[@]} == 0)) || nixfmt --check "${files[@]}"'
    statix:
      glob: "*.nix"
      run: statix check .
    deadnix:
      glob: "*.nix"
      run: deadnix --fail .
    fmt:
      glob: "*.rs"
      run: cargo fmt --check
    clippy:
      glob: "*.rs"
      run: cargo clippy -- -D warnings
    ls-lint:
      run: git ls-files -z | xargs -0 ls_lint
    file-length:
      glob: "*.rs"
      run: |
        for f in {staged_files}; do
          n=$(wc -l < "$f")
          [ "$n" -le 500 ] || { echo "$f: $n lines (max 500)"; fail=1; }
        done
        exit ${fail:-0}
