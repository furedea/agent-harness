too-many-arguments-threshold = 3
excessive-nesting-threshold = 2
cognitive-complexity-threshold = 15
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true

# Writes belong to the filesystem port in `src/shell/io.rs`; everything else returns `FileOp`
# values for the executor to apply. Reads belong to the loader in `src/shell/load.rs`; computation
# receives a `Snapshot` it can only query. Computation modules also `forbid` these lints, so they
# cannot allow them again.
disallowed-methods = [
  { path = "std::fs::write", reason = "return a FileOp and let shell::execute write it" },
  { path = "std::fs::copy", reason = "return a FileOp::CopyFile and let shell::execute copy it" },
  { path = "std::fs::create_dir", reason = "return a FileOp and let shell::execute create parents" },
  { path = "std::fs::create_dir_all", reason = "return a FileOp and let shell::execute create parents" },
  { path = "std::fs::remove_file", reason = "removal belongs to the filesystem port" },
  { path = "std::fs::remove_dir", reason = "removal belongs to the filesystem port" },
  { path = "std::fs::remove_dir_all", reason = "removal belongs to the filesystem port" },
  { path = "std::fs::rename", reason = "renames belong to the filesystem port" },
  { path = "std::fs::hard_link", reason = "links belong to the filesystem port" },
  { path = "std::fs::soft_link", reason = "links belong to the filesystem port" },
  { path = "std::fs::set_permissions", reason = "modes are set through FileMode" },
  { path = "std::fs::File::create", reason = "return a FileOp and let shell::execute write it" },
  { path = "std::fs::File::create_new", reason = "return a FileOp and let shell::execute write it" },
  { path = "std::fs::OpenOptions::open", reason = "opening for write belongs to the filesystem port" },
  { path = "std::fs::DirBuilder::create", reason = "directories are created by the filesystem port" },
  { path = "std::os::unix::fs::symlink", reason = "links belong to the filesystem port" },
  { path = "std::fs::read", reason = "read through the Snapshot the shell loaded" },
  { path = "std::fs::read_to_string", reason = "read through the Snapshot the shell loaded" },
  { path = "std::fs::read_dir", reason = "list through the Snapshot the shell loaded" },
  { path = "std::fs::metadata", reason = "ask the Snapshot the shell loaded" },
  { path = "std::fs::symlink_metadata", reason = "ask the Snapshot the shell loaded" },
  { path = "std::fs::canonicalize", reason = "resolve paths in the shell" },
  { path = "std::fs::read_link", reason = "resolve paths in the shell" },
  { path = "std::path::Path::exists", reason = "ask the Snapshot the shell loaded" },
  { path = "std::path::Path::try_exists", reason = "ask the Snapshot the shell loaded" },
  { path = "std::path::Path::is_file", reason = "ask the Snapshot the shell loaded" },
  { path = "std::path::Path::is_dir", reason = "ask the Snapshot the shell loaded" },
  { path = "std::path::Path::is_symlink", reason = "ask the Snapshot the shell loaded" },
  { path = "std::path::Path::metadata", reason = "ask the Snapshot the shell loaded" },
  { path = "std::path::Path::symlink_metadata", reason = "ask the Snapshot the shell loaded" },
  { path = "std::path::Path::read_dir", reason = "list through the Snapshot the shell loaded" },
  { path = "std::path::Path::read_link", reason = "resolve paths in the shell" },
  { path = "std::path::Path::canonicalize", reason = "resolve paths in the shell" },
  { path = "std::env::var", reason = "the environment is read at the boundary" },
  { path = "std::env::var_os", reason = "the environment is read at the boundary" },
  { path = "std::env::vars", reason = "the environment is read at the boundary" },
  { path = "std::env::vars_os", reason = "the environment is read at the boundary" },
  { path = "std::env::current_dir", reason = "the working directory is read at the boundary" },
  { path = "std::env::current_exe", reason = "the executable path is read at the boundary" },
  { path = "std::env::home_dir", reason = "the home directory is read at the boundary" },
  { path = "std::process::Command::new", reason = "processes are started at the boundary" },
]
disallowed-types = [
  { path = "std::fs::File", reason = "file handles belong to the filesystem port" },
  { path = "std::fs::OpenOptions", reason = "opening for write belongs to the filesystem port" },
  { path = "std::fs::DirBuilder", reason = "directories are created by the filesystem port" },
]
