ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  .*: regex:[a-z0-9]*([._][a-z0-9]+)*

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - docs/logs

  - README.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - .release-please-manifest.json
  - release-please-config.json
  - package-lock.json
  - "profiles/*/agents/AGENTS.md"
  - "profiles/*/agents/skills/*/SKILL.md"
  - Cargo.toml
  - Cargo.lock

  - .coverage
  - .venv
  - .uv-cache
  - .ruff_cache
  - .pytest_cache
  - .ipynb_checkpoints
  - "profiles/**/__pycache__"
  - "tests/**/__pycache__"
  - node_modules
  - "profiles/*/agents/hooks/docs/logs"
  - target
