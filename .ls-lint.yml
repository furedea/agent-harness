ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  <<: &files
    .md: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:(README|CONTRIBUTING|CHANGELOG|AGENTS|CLAUDE|SKILL) | regex:(README|DESIGN)(_ja)?
    .toml: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:Cargo
    .lock: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:Cargo
    .json: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:package-lock
    .*: regex:[a-z0-9]*([._][a-z0-9]+)*
  # Rust module directories are identifiers, so they use snake_case.
  # A nested block replaces the root rules, so it re-merges the file rules.
  src:
    <<: *files
    .dir: regex:[a-z0-9]+(_[a-z0-9]+)*

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - .release-please-manifest.json
  - release-please-config.json
  - "{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - "**/{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - docs/logs
  - "**/docs/logs"
  - "**/__init__.py"
